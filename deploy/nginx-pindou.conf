# 拼豆定制工作台 — nginx 站点配置
#
# 这是一个纯静态站点（Vite 的 dist/），没有后端、没有数据库、没有外部接口，
# 所有数据都存在访问者自己的浏览器 IndexedDB 里。
# 路由是 hash 形式（#/editor），所以不需要任何服务端 rewrite。
#
# 用法：
#   scp deploy/nginx-pindou.conf 服务器:/tmp/pindou.conf
#   sudo mv /tmp/pindou.conf /etc/nginx/sites-available/pindou
#   sudo ln -sf /etc/nginx/sites-available/pindou /etc/nginx/sites-enabled/pindou
#   sudo nginx -t && sudo systemctl reload nginx
#
# 放 sites-enabled 而不是 conf.d，是为了不抢走 privacy 站的 default_server 身份
# （conf.d 先于 sites-enabled 加载，谁先加载谁当默认服务器）。
#
# 装好证书后由 certbot 自己往这个文件里加 443 段：
#   sudo certbot --nginx -d pindou.liangfeiyan.cn

server {
    listen 80;
    listen [::]:80;
    server_name pindou.liangfeiyan.cn;

    root /var/www/pindou;
    index index.html;

    # 文件名里带内容 hash 的构建产物：可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # 入口文件必须每次问服务器，否则发新版后用户还是旧 index.html，
    # 里面指向的 assets 已经被删掉 → 白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
}
