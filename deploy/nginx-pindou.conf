# 拼豆定制工作台 — nginx 站点配置
#
# 这是一个纯静态站点（Vite 的 dist/），没有后端、没有数据库、没有外部接口，
# 所有数据都存在访问者自己的浏览器 IndexedDB 里。
# 路由是 hash 形式（#/editor），所以不需要服务端 rewrite。
#
# 用法：
#   scp deploy/nginx-pindou.conf 服务器:/tmp/pindou.conf
#   sudo mv /tmp/pindou.conf /etc/nginx/sites-available/pindou
#   sudo ln -sf /etc/nginx/sites-available/pindou /etc/nginx/sites-enabled/pindou
#   sudo nginx -t && sudo systemctl reload nginx
#
# 装好证书后把同样的安全响应头复制到 HTTPS server 段，并保留 HSTS。

server {
    listen 80;
    listen [::]:80;
    server_name pindou.liangfeiyan.cn;

    root /var/www/pindou;
    index index.html;

    # HTTP 只负责证书挑战和跳转，避免用户绕过 HTTPS。
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        try_files $uri $uri/ /index.html;
    }

    # 文件名里带内容 hash 的构建产物：可以放心长缓存。
    location /assets/ {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # 入口文件必须每次问服务器，否则发新版后用户还是旧 index.html，
    # 里面指向的 assets 已经被删掉 → 白屏。
    location = /index.html {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'" always;
    # 仅在 HTTPS server 段启用；HTTP 响应中的 HSTS 会被浏览器忽略。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
